<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>whereivebeen</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmtpdHdlIiwiYSI6ImNtdTVlZXE2ZzBkemgyenNoOGZsazYzYXYifQ.jIsiWt1bOF69w0oQYvhaxA';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/satellite-streets-v12',  // good ones: outdoors-v12  satellite-v9  satellite-streets-v12
        center: [0, 0],
        zoom: 0.8,
        projection: 'equalEarth'
    });
    map.on('load', () => {
		
        // Load the places from the separate GeoJSON file
        map.addSource('places', {
            type: 'geojson',
            data: './whereivebeen.geojson'
        });
		
        // Draw each place as a small red dot
        map.addLayer({
            id: 'places',
            type: 'circle',
            source: 'places',
            paint: {
                'circle-radius': 3.5,
                'circle-color': '#e31a1c',
		'circle-stroke-color': '#fff',
		'circle-stroke-width': 1.5
            }
        });

        // Show information when a place is clicked
        map.on('click', 'places', (e) => {

            const feature = e.features[0];
            const coordinates = feature.geometry.coordinates.slice();
            const location = feature.properties.name;
            const country = feature.properties.country;

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(`
				    <strong>${location}</strong><br>
                    ${country}`)
                .addTo(map);
        });

        // Change cursor when hovering over a place
        map.on('mouseenter', 'places', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'places', () => {
            map.getCanvas().style.cursor = '';
        });
    });
</script>

</body>
</html>
