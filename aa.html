<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>whereivebeen</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }

/* Style selector */
#style-selector {
position: absolute; top: 10px; left: 10px; z-index: 1;
background: white;
padding: 8px;
border-radius: 4px;
font-family: Arial, sans-serif;
font-size: 14px;
box-shadow: 0 1px 4px rgba(0,0,0,0.2);}
#style-selector select {font-size: 14px; padding: 4px;}
</style>
</head>
	
<body>
<div id="map"></div>

<!-- Map style selector -->
<div id="style-selector">
    <label for="style-select">Map:</label>
    <select id="style-select">
        <option value="mapbox://styles/mapbox/outdoors-v12"> Outdoors </option>
        <option value="mapbox://styles/mapbox/standard"> Standard </option>
        <option value="mapbox://styles/mapbox/satellite-v9"> Satellite </option>
    </select>
</div>
	
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmtpdHdlIiwiYSI6ImNtdTVlZXE2ZzBkemgyenNoOGZsazYzYXYifQ.jIsiWt1bOF69w0oQYvhaxA';

	// --------------------------------------------------
    // Create map
    // --------------------------------------------------
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',  // good ones: outdoors-v12  satellite-v9  satellite-streets-v12
        center: [0, 0],
        zoom: 0.8,
        projection: 'equalEarth'
    });
    // --------------------------------------------------
    // Add navigation controls
    // --------------------------------------------------
    map.addControl(
        new mapboxgl.NavigationControl({
            showZoom: true,
            showCompass: true
        }),
        'top-right'
    );

    // --------------------------------------------------
    // Add distance scale
    // --------------------------------------------------
    const scale = new mapboxgl.ScaleControl({
        maxWidth: 120,
        unit: 'metric'
    });
    map.addControl(scale, 'bottom-left');

    // --------------------------------------------------
    // Function to add places
    // --------------------------------------------------
    function addPlaces() {

        // Load the places from the GeoJSON file
        map.addSource('places', {
            type: 'geojson',
            data: './whereivebeen.geojson'
        });

        // Draw each place as a small red dot
        map.addLayer({
            id: 'places',
            type: 'circle',
            source: 'places',

            paint: {
                'circle-radius': 3.5,
                'circle-color': '#e31a1c',
		'circle-stroke-color': '#fff',
		'circle-stroke-width': 1.5
            }
        });

        // --------------------------------------------------
        // Click on a place
        // --------------------------------------------------
        map.on('click', 'places', (e) => {

            const feature = e.features[0];
            const coordinates = feature.geometry.coordinates.slice();
            const location = feature.properties.location;
            const country = feature.properties.country;

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(`
                    <strong>${location}</strong>
                    <br>
                    ${country} `)
                .addTo(map);
        });

        // Change cursor when hovering over a place
        map.on('mouseenter', 'places', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'places', () => {
            map.getCanvas().style.cursor = '';
        });
    }

    // --------------------------------------------------
    // Add places when map first loads
    // --------------------------------------------------
    map.on('load', () => {
        addPlaces();
    });

    // --------------------------------------------------
    // Map style selector
    // --------------------------------------------------
    document
        .getElementById('style-select')
        .addEventListener('change', (event) => {
            const newStyle = event.target.value;
            map.setStyle(newStyle);
        });

    // --------------------------------------------------
    // Re-add places after changing style
    // --------------------------------------------------
    map.on('style.load', () => {
        // Don't add them twice when the map initially loads
        if (!map.getSource('places')) {
            addPlaces();
        }
    });
</script>

</body>
</html>
