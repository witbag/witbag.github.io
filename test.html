<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Interesting Places – Equal Earth Map</title> <!-- D3 --> <script src="https://cdn.jsdelivr.net/npm/d3@7"></script> <!-- TopoJSON --> <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script> <style> html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9d5df; font-family: Arial, sans-serif; } #map { width: 100%; height: 100%; } svg { width: 100%; height: 100%; display: block; } /* Ocean */ .ocean { fill: #b9d5df; } /* Countries / land */ .land { fill: #b8c99a; stroke: #8c9b78; stroke-width: 0.6; } /* Location dots */ .marker { fill: #d63b3b; stroke: white; stroke-width: 0.8; cursor: pointer; } .marker:hover { fill: #a82020; } /* Tooltip */ #tooltip { position: fixed; pointer-events: none; background: rgba(30, 35, 35, 0.9); color: white; padding: 6px 9px; border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity 0.1s; z-index: 10; } /* Small instruction */ #instructions { position: fixed; left: 15px; bottom: 15px; padding: 6px 9px; background: rgba(255,255,255,0.75); color: #455555; border-radius: 4px; font-size: 12px; } </style> </head> <body> <div id="map"></div> <div id="tooltip"></div> <div id="instructions"> Drag to move · Scroll to zoom · Hover over a place </div> <script> // ============================================================ // YOUR LOCATIONS // // Later, replace these 10 locations with your ~500 places. // // IMPORTANT: // lon = longitude // lat = latitude // ============================================================ const places = [ { name: "London", lat: 51.5074, lon: -0.1278 }, { name: "New York", lat: 40.7128, lon: -74.0060 }, { name: "Mexico City", lat: 19.4326, lon: -99.1332 }, { name: "Rio de Janeiro", lat: -22.9068, lon: -43.1729 }, { name: "Cape Town", lat: -33.9249, lon: 18.4241 }, { name: "Cairo", lat: 30.0444, lon: 31.2357 }, { name: "Mumbai", lat: 19.0760, lon: 72.8777 }, { name: "Tokyo", lat: 35.6762, lon: 139.6503 }, { name: "Sydney", lat: -33.8688, lon: 151.2093 }, { name: "Auckland", lat: -36.8509, lon: 174.7645 } ]; // ============================================================ // CREATE SVG // ============================================================ const mapElement = document.getElementById("map"); const svg = d3 .select("#map") .append("svg"); // Everything on the map goes inside this group. const mapGroup = svg .append("g"); // ============================================================ // EQUAL EARTH PROJECTION // ============================================================ const projection = d3 .geoEqualEarth(); const path = d3 .geoPath() .projection(projection); // ============================================================ // LOAD WORLD MAP // ============================================================ d3.json( "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json" ) .then(function(world) { console.log("World map loaded"); // Convert TopoJSON into GeoJSON. const countries = topojson.feature( world, world.objects.countries ); drawMap(countries); }) .catch(function(error) { console.error("Could not load world map:", error); document.getElementById("map").innerHTML = "<p style='padding:30px;color:red'>" + "Could not load the world map. Please check your internet connection." + "</p>"; }); // ============================================================ // DRAW MAP // ============================================================ function drawMap(countries) { const width = mapElement.clientWidth; const height = mapElement.clientHeight; // Size SVG to the window. svg .attr("viewBox", `0 0 ${width} ${height}`); // Fit the world into the available space. projection.fitExtent( [ [20, 20], [width - 20, height - 20] ], countries ); // ---------------------------------------------------------- // OCEAN // ---------------------------------------------------------- mapGroup .append("path") .datum({ type: "Sphere" }) .attr("class", "ocean") .attr("d", path); // ---------------------------------------------------------- // LAND // ---------------------------------------------------------- mapGroup .append("g") .attr("class", "countries") .selectAll("path") .data(countries.features) .join("path") .attr("class", "land") .attr("d", path); // ---------------------------------------------------------- // MARKERS // ---------------------------------------------------------- const markers = mapGroup .append("g") .attr("class", "markers"); markers .selectAll("circle") .data(places) .join("circle") .attr("class", "marker") .attr("r", 3.5) .attr("cx", function(d) { return projection([d.lon, d.lat])[0]; }) .attr("cy", function(d) { return projection([d.lon, d.lat])[1]; }) // Hover .on("mouseenter", function(event, d) { d3.select(this) .transition() .duration(100) .attr("r", 5); document.getElementById("tooltip") .textContent = d.name; document.getElementById("tooltip") .style.opacity = 1; }) .on("mousemove", function(event) { document.getElementById("tooltip") .style.left = (event.clientX + 12) + "px"; document.getElementById("tooltip") .style.top = (event.clientY + 12) + "px"; }) // Stop hovering .on("mouseleave", function() { d3.select(this) .transition() .duration(100) .attr("r", 3.5); document.getElementById("tooltip") .style.opacity = 0; }); console.log("Map drawn successfully"); } // ============================================================ // ZOOM AND PAN // ============================================================ const zoom = d3 .zoom() .scaleExtent([1, 8]) .on("zoom", function(event) { mapGroup.attr( "transform", event.transform ); }); svg.call(zoom); </script> </body> </html>
